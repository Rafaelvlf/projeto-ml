site_name: Projeto ML - Predição de AVC
site_description: Relatório de EDA e pré-processamento (APS1) e de classificação (APS2) do Stroke Prediction Dataset
site_author: Erick Barbosa e Rafael Lemos
site_url: https://rafaelvlf.github.io/projeto-ml/
repo_url: https://github.com/Rafaelvlf/projeto-ml
repo_name: Rafaelvlf/projeto-ml

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Início: index.md
  - APS1 - Análise Exploratória:
      - Visão Geral e Dicionário: eda/dicionario.md
      - Análise Univariada: eda/univariada.md
      - Análise Bivariada: eda/bivariada.md
      - Análise Multivariada e Outliers: eda/multivariada.md
      - Redução de Dimensionalidade (PCA): eda/pca.md
      - Pipeline de Pré-processamento: eda/pipeline.md
      - Conclusão: conclusao.md
  - APS2 - Classificação:
      - Resumo: aps2/index.md
      - Modelos e Hiperparâmetros: aps2/modelos.md
      - Mudança no Pipeline e Curvas de Aprendizado: aps2/mudanca.md
      - Avaliação no Teste: aps2/teste.md
      - Interpretação e Explicabilidade: aps2/interpretacao.md
      - Discussão Crítica: aps2/discussao.md
      - Referências: aps2/referencias.md
